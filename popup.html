<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Trascrizione YouTube</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap");

      :root {
        --void: #0a0b10;
        --surface: #12141c;
        --surface-2: #1b1e29;
        --line: #2a2e3d;
        --cyan: #19e3e0;
        --magenta: #ff2e88;
        --violet: #7b61ff;
        --acid: #c6ff3a;
        --success: #22e58b;
        --warning: #ffb020;
        --danger: #ff4d4d;
        --text-hi: #eaf0f7;
        --text-mid: #a6b0c3;
        --text-low: #626b80;
        --grad-neon: linear-gradient(135deg, #19e3e0 0%, #7b61ff 50%, #ff2e88 100%);
        --glow-cyan: 0 0 0 1px #19e3e0, 0 0 20px -4px #19e3e0;
        --glow-magenta: 0 0 0 1px #ff2e88, 0 0 20px -4px #ff2e88;
        --focus-ring: 0 0 0 2px #0a0b10, 0 0 0 4px #19e3e0;
        --r-sm: 2px;
        --r-md: 4px;
        --r-lg: 8px;
        --notch: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        background: var(--void);
        color: var(--text-hi);
        font-family: "Inter", system-ui, sans-serif;
      }

      body {
        width: 360px;
        min-height: 360px;
        padding: 14px;
        background:
          radial-gradient(circle at top right, rgba(25, 227, 224, 0.12), transparent 32%),
          radial-gradient(circle at bottom left, rgba(255, 46, 136, 0.1), transparent 26%),
          var(--void);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0 1px,
          transparent 1px 3px
        );
        opacity: 0.8;
      }

      .shell {
        position: relative;
        background: rgba(18, 20, 28, 0.92);
        border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 16px 16px 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .shell::before,
      .shell::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: var(--cyan);
        border-style: solid;
        opacity: 0.9;
      }

      .shell::before {
        top: 8px;
        left: 8px;
        border-width: 1px 0 0 1px;
      }

      .shell::after {
        right: 8px;
        bottom: 8px;
        border-width: 0 1px 1px 0;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }

      .brand-group {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }

      .brand-tag,
      .live-pill,
      .meta-label,
      .section-tag {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 10px;
      }

      .brand-tag {
        color: var(--cyan);
      }

      .brand-name {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: var(--text-hi);
        letter-spacing: -0.05em;
      }

      .live-pill {
        color: var(--success);
        border: 1px solid rgba(34, 229, 139, 0.5);
        background: rgba(34, 229, 139, 0.08);
        border-radius: 999px;
        padding: 2px 7px;
      }

      .hero-panel {
        position: relative;
        margin-bottom: 14px;
        padding: 12px 12px 10px;
        background: rgba(27, 30, 41, 0.9);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .hero-panel::before {
        content: "";
        position: absolute;
        inset: 0 auto auto 0;
        width: 100%;
        height: 2px;
        background: var(--grad-neon);
        opacity: 0.9;
      }

      .section-tag {
        display: inline-block;
        margin-bottom: 8px;
        color: var(--cyan);
      }

      .video-meta {
        display: grid;
        gap: 6px;
      }

      .meta-label {
        color: var(--text-low);
      }

      #title {
        color: var(--text-hi);
        font-size: 12px;
        line-height: 1.5;
        max-height: 5.4em;
        overflow: hidden;
        word-break: break-word;
      }

      .action-stack {
        display: grid;
        gap: 8px;
      }

      button {
        position: relative;
        width: 100%;
        border: 1px solid rgba(25, 227, 224, 0.45);
        background: linear-gradient(180deg, rgba(18, 20, 28, 0.95), rgba(11, 13, 18, 0.95));
        color: var(--text-hi);
        font: 600 12px/1.2 "Inter", sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 10px 12px;
        cursor: pointer;
        clip-path: var(--notch);
        transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      button::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, rgba(25, 227, 224, 0.06), rgba(123, 97, 255, 0.12), rgba(255, 46, 136, 0.06));
        opacity: 0;
        transition: opacity 120ms ease;
      }

      button:not(:disabled):hover {
        transform: translateY(-1px);
        border-color: var(--cyan);
        box-shadow: var(--glow-cyan);
      }

      button:not(:disabled):hover::before,
      button:not(:disabled):focus-visible::before {
        opacity: 1;
      }

      button:not(:disabled):focus-visible {
        outline: none;
        box-shadow: var(--focus-ring);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        border-color: var(--line);
      }

      #claudeBtn {
        border-color: rgba(255, 46, 136, 0.45);
      }

      #copyBtn {
        border-color: rgba(123, 97, 255, 0.45);
      }

      #status {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--text-mid);
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.5;
        min-height: 2.2em;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-group">
          <span class="brand-tag">// SYS</span>
          <span class="brand-name">VOLTA</span>
        </div>
        <span class="live-pill">online</span>
      </header>

      <section class="hero-panel">
        <span class="section-tag">transcript</span>
        <div class="video-meta">
          <span class="meta-label">Titolo</span>
          <div id="title">Caricamento metadata...</div>
        </div>
      </section>

      <div class="action-stack">
        <button id="saveBtn" disabled>Salva come Markdown</button>
        <button id="copyBtn" disabled>Copia trascrizione</button>
        <button id="claudeBtn" disabled>Apri in nuova chat Claude</button>
      </div>

      <div id="status">Caricamento...</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
